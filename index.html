<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ofonime Usuyak | 3 Portfolio Editions Switcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #111518;
      --bar: #181E24;
      --ink: #F2F4F7;
      --muted: #9BA5B4;
      --accent: #E25B26;
      --line: #2B3540;
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .switcher-bar {
      height: 60px;
      padding: 0 20px;
      background: var(--bar);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-shrink: 0;
    }

    .brand {
      font-weight: 700;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }

    .badge {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(226, 91, 38, 0.18);
      color: #FF8B5E;
      border: 1px solid rgba(226, 91, 38, 0.4);
    }

    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
    }

    .tab-btn {
      font-family: inherit;
      min-height: 38px;
      padding: 0 14px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--muted);
      font-weight: 600;
      font-size: 0.84rem;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 160ms var(--ease-out), background-color 160ms var(--ease-out), color 160ms var(--ease-out);
    }

    .tab-btn:active {
      transform: scale(0.97);
    }

    .tab-btn[aria-selected="true"] {
      background: var(--accent);
      color: #FAF8F5;
      border-color: var(--accent);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }

    .open-btn {
      display: inline-flex;
      align-items: center;
      min-height: 38px;
      padding: 0 14px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #222B34;
      color: var(--ink);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .open-btn:hover {
      border-color: var(--ink);
    }

    .stage {
      flex: 1;
      width: 100%;
      border: 0;
      background: #F6F3EC;
    }
  </style>
</head>
<body>
  <header class="switcher-bar">
    <div class="brand">
      <span>Ofonime Usuyak (ofonn)</span>
      <span class="badge">110 LIVE SITES</span>
    </div>

    <div class="tabs" role="tablist" aria-label="Choose portfolio edition">
      <button type="button" class="tab-btn" role="tab" aria-selected="true" data-src="portfolio-1-studio.html">
        Edition 1: Sovereign Studio Ledger (Light)
      </button>
      <button type="button" class="tab-btn" role="tab" aria-selected="false" data-src="portfolio-2-command.html">
        Edition 2: Engineering Command Deck (Dark)
      </button>
      <button type="button" class="tab-btn" role="tab" aria-selected="false" data-src="portfolio-3-kinetic.html">
        Edition 3: Kinetic Swiss Poster Grid
      </button>
    </div>

    <div class="actions">
      <a id="full-link" href="portfolio-1-studio.html" target="_blank" rel="noopener" class="open-btn">
        Open Current Edition Full-Screen ->
      </a>
    </div>
  </header>

  <iframe id="portfolio-frame" class="stage" title="Portfolio preview" src="portfolio-1-studio.html"></iframe>

  <script>
    (function () {
      const btns = document.querySelectorAll(".tab-btn");
      const frame = document.getElementById("portfolio-frame");
      const fullLink = document.getElementById("full-link");

      btns.forEach(function (btn) {
        btn.addEventListener("click", function () {
          const src = btn.getAttribute("data-src");
          frame.src = src;
          fullLink.href = src;
          btns.forEach(function (b) {
            b.setAttribute("aria-selected", b === btn ? "true" : "false");
          });
        });
      });
    })();
  </script>
</body>
</html>
